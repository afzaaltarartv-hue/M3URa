<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Frosted Border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Glass Inner Reflection -->
  <path d="M6 20C6 11.1634 13.1634 4 22 4H42C50.8366 4 58 11.1634 58 20V24C44 26 22 28 6 34V20Z" fill="white" fill-opacity="0.12" />

  <!-- Play Symbol with Luminous Glow -->
  <polygon points="26,20 45,32 26,44" fill="url(#glowGrad)" filter="url(#glow)" />
  <polygon points="26,20 45,32 26,44" fill="#ffffff" fill-opacity="0.9" />

  <!-- Live TV Signal Beams -->
  <circle cx="48" cy="16" r="2.5" fill="#ef4444" />
</svg>
